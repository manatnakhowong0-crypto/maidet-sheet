<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ไม้เด็ด: สต็อก ขาย กำไร</title>
<meta name="theme-color" content="#2E6A45">
<meta name="application-name" content="ไม้เด็ด">
<meta name="apple-mobile-web-app-title" content="ไม้เด็ด">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F0;--surface:#FFFFFF;--ink:#1D2620;--muted:#5E6B62;--line:#D9DED6;
  --leaf:#2E6A45;--leaf-soft:#E3EEE6;--chili:#C8372D;--chili-soft:#F8E4E1;--gold:#A86B12;--gold-soft:#F6EBD6;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141A16;--surface:#1D2520;--ink:#E8EDE7;--muted:#9AA79E;--line:#2D3831;
  --leaf:#63B584;--leaf-soft:#223329;--chili:#EF6A5F;--chili-soft:#3A2220;--gold:#E0A84A;--gold-soft:#3A2F1C;}}
:root[data-theme="dark"]{
  --bg:#141A16;--surface:#1D2520;--ink:#E8EDE7;--muted:#9AA79E;--line:#2D3831;
  --leaf:#63B584;--leaf-soft:#223329;--chili:#EF6A5F;--chili-soft:#3A2220;--gold:#E0A84A;--gold-soft:#3A2F1C;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Sarabun","Noto Sans Thai",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.num{font-family:"Kanit","Noto Sans Thai",system-ui,sans-serif;font-weight:500}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 110px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.brand h1{margin:0;white-space:nowrap}
.brand small{color:var(--muted);font-size:.85rem;text-align:right}
#peers{color:var(--leaf);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--leaf);margin-right:4px;vertical-align:1px}
.flash{animation:fl .6s}
@keyframes fl{from{background:var(--leaf-soft)}to{background:transparent}}
.till{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.till div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.till span{display:block;font-size:.78rem;color:var(--muted)}
.till b{font-family:Kanit,sans-serif;font-weight:600;font-size:1.25rem}
.till .profit b{color:var(--leaf)}

.bar{display:flex;gap:8px;margin:12px 0 6px}
.search{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

h2.cat{font-size:1rem;color:var(--muted);margin:18px 2px 6px;display:flex;justify-content:space-between}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .info{flex:1;min-width:0}
.row .name{font-weight:600;line-height:1.3}
.row .meta{font-size:.85rem;color:var(--muted)}
.meta .low{color:var(--gold);font-weight:600}
.meta .out{color:var(--chili);font-weight:600}
.meta .warn{color:var(--gold)}
.sold{min-width:34px;text-align:center;font-family:Kanit,sans-serif;font-size:1.2rem}
.sold.zero{color:var(--line)}
.btn-m{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:1.4rem;line-height:1}
.btn-p{height:48px;min-width:64px;border-radius:12px;border:0;background:var(--chili);color:#fff;font-family:Kanit,sans-serif;font-size:1.05rem;padding:0 12px}
.btn-p:disabled{background:var(--line);color:var(--muted)}
.btn-p:active,.btn-m:active{transform:scale(.95)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.card h3{margin:0 0 8px;font-size:1.05rem}
label{display:block;font-size:.88rem;color:var(--muted);margin:10px 0 4px}
.field{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--leaf-soft);font-size:.95rem}
.calc b{font-family:Kanit,sans-serif;font-size:1.15rem}
.check{display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-size:.9rem;margin-top:12px}
.check input{margin-top:4px}
.primary{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:var(--leaf);color:#fff;font-family:Kanit,sans-serif;font-size:1.05rem}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px}
.del{border:0;background:none;color:var(--chili);font-size:.95rem;padding:8px 2px;min-width:30px;min-height:40px}

.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
.daynav input{padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.money{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.money div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.money span{display:block;font-size:.82rem;color:var(--muted)}
.money b{font-family:Kanit,sans-serif;font-weight:600;font-size:1.4rem}
.money .big{grid-column:1/-1;background:var(--leaf-soft);border-color:transparent}
.money .big b{font-size:2rem;color:var(--leaf)}
.money .neg b{color:var(--chili)}
.note{font-size:.85rem;color:var(--muted);margin:8px 2px 0}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:7px 6px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{color:var(--muted);font-weight:400;border-top:0}

.edit-row{display:grid;grid-template-columns:40px 1fr 46px 46px 46px 30px;gap:4px;gap:6px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}
.edit-row:first-child{border-top:0}
.edit-row.head{font-size:.78rem;color:var(--muted);padding-bottom:0}
.edit-row input{width:100%;padding:7px 3px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:right}
.edit-row input.nm{text-align:left}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}
.banner{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--gold-soft);color:var(--ink);font-size:.9rem}


.modes{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.modes button{border:0;background:none;padding:11px;font-family:Kanit,sans-serif;font-size:1.05rem;color:var(--muted)}
.modes button[data-mode="sell"][aria-pressed="true"]{background:var(--chili);color:#fff}
.modes button[data-mode="stock"][aria-pressed="true"]{background:var(--leaf);color:#fff}
.steps{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:.9rem;color:var(--muted)}
.hint{margin:8px 2px 0;font-size:.88rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.tile{position:relative}
.tap{display:flex;flex-direction:column;width:100%;padding:0;border:2px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;text-align:left}
.mode-sell .tap:active{border-color:var(--chili)}
.mode-stock .tap{border-color:var(--leaf-soft)}
.mode-stock .tap:active{border-color:var(--leaf)}
.tile.off .tap{opacity:.45}
.pic{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--bg)}
.ph{display:flex;align-items:center;justify-content:center;font-family:Kanit,sans-serif;font-size:2.4rem;color:#fff}
.ph-grill{background:#B8562F}.ph-ball{background:#7A5AA6}
.tname{font-weight:600;font-size:.9rem;line-height:1.25;padding:6px 8px 0;min-height:2.5em}
.tmeta{font-size:.78rem;color:var(--muted);padding:0 8px 7px}
.tmeta .low{color:var(--gold);font-weight:600}.tmeta .out{color:var(--chili);font-weight:600}
.badge{position:absolute;top:6px;left:6px;background:var(--chili);color:#fff;border-radius:999px;padding:1px 8px;font-family:Kanit,sans-serif;font-size:.85rem}
.badge.add{background:var(--leaf)}
.minus{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:1.2rem;line-height:1}
.pop{animation:pop .25s}
@keyframes pop{50%{transform:scale(.94)}}
.imgpick{position:relative;display:block;margin:0;cursor:pointer}
.imgpick input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.thumb{display:flex;width:40px;height:40px;border-radius:8px;object-fit:cover;font-size:1.2rem}
.linkbtn{border:0;background:none;color:var(--chili);font-size:.78rem;padding:2px 0}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet[hidden]{display:none}
.sheet-box{background:var(--surface);color:var(--ink);border-radius:16px;padding:18px;width:100%;max-width:420px}
.sheet-box p{margin:0 0 14px;font-size:1.05rem}
.sheet-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet-btns button{padding:12px;font-size:1rem;border-radius:12px}
.danger{border:0;background:var(--chili);color:#fff;font-family:Kanit,sans-serif}
.modes.three{grid-template-columns:1fr 1fr 1fr}
.modes.three button{font-size:.92rem;padding:10px 4px}
.modes button[data-rmode][aria-pressed="true"]{background:var(--leaf);color:#fff}
.line{display:grid;grid-template-columns:1fr 76px 40px 32px;gap:6px;align-items:center;margin-top:6px}
.line .field{padding:9px 8px}
.u{font-size:.85rem;color:var(--muted)}
.tag{display:inline-block;font-size:.72rem;font-family:Kanit,sans-serif;padding:0 7px;border-radius:6px;margin-right:6px;vertical-align:2px;color:#fff}
.tag.buy{background:#2F6FA3}.tag.make{background:var(--leaf)}.tag.exp{background:var(--gold)}
.rowbtns{display:flex;flex-direction:column;gap:4px}
.ghost.sm{padding:4px 10px;font-size:.85rem}
.nextstep{display:flex;justify-content:space-between;align-items:center;gap:8px}
.raw-row{display:grid;grid-template-columns:1fr 52px 56px 56px 30px;gap:4px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}
.raw-row:first-child{border-top:0}
.raw-row.head{font-size:.78rem;color:var(--muted);padding-bottom:0}
.raw-row input{width:100%;padding:7px 3px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:right}
.raw-row input.nm{text-align:left}
.trace{padding:8px 0;border-top:1px solid var(--line)}
.trace:first-of-type{border-top:0}
.money div:nth-child(3):last-child{grid-column:1/-1}
.logo{font-family:Kanit,sans-serif;font-weight:600;font-size:1.55rem;letter-spacing:-.01em;line-height:1;display:flex;align-items:baseline;gap:8px}
.logo::before{content:"";display:inline-block;width:4px;height:1.05em;background:var(--chili);border-radius:2px;transform:rotate(18deg) translateY(2px);box-shadow:6px 0 0 var(--gold)}
.logo span{font-family:Sarabun,sans-serif;font-weight:400;font-size:.8rem;color:var(--muted);letter-spacing:0}
.modes button[data-smode][aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.mlabel{font-family:Kanit,sans-serif;font-weight:500;font-size:1.1rem}
.ghost:disabled{opacity:.4}
.chart{width:100%;min-width:420px;height:150px;display:block}
.chart .rv{fill:var(--line)}.chart .pf{fill:var(--leaf)}
.chart .bar{cursor:pointer}.chart .bar:hover .rv{fill:var(--muted)}
.chart text{font-size:9px;fill:var(--muted);font-family:Sarabun,sans-serif}
.legend{display:flex;gap:6px;align-items:center;font-size:.82rem;color:var(--muted);margin-bottom:6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:6px}.sw.rev{background:var(--line)}.sw.pro{background:var(--leaf)}
.linkbtn-big{display:block;text-align:center;text-decoration:none;margin-top:10px}
.sheetlink{display:block;text-align:center;text-decoration:none;color:var(--leaf);margin-top:10px;padding:10px}
.modes button[data-smode="sheet"][aria-pressed="true"]{background:#2F6FA3;color:#fff}
.srcbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
tr.pick{cursor:pointer}tr.pick.on td{font-weight:600;color:var(--leaf)}
.banner.bad{background:var(--chili-soft);border-left:4px solid var(--chili)}
.diag{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:.92rem}
.diag:first-of-type{border-top:0}.diag span{color:var(--muted)}.diag b{font-weight:600;text-align:right}
.diag b.ok{color:var(--leaf)}.diag b.no{color:var(--chili)}
textarea.field{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;resize:vertical}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:10px 4px 12px;font-family:Kanit,sans-serif;font-size:.95rem;color:var(--muted)}
nav.tabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--chili)}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:9}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1 class="logo">ไม้เด็ด<span>สต็อก ขาย กำไร</span></h1><small><span id="peers"></span> <span id="status">กำลังเชื่อมต่อ…</span></small></div>
    <div class="till">
      <div><span>ขายวันนี้</span><b id="tRev">0</b></div>
      <div><span>ทุนที่ขายไป</span><b id="tCost">0</b></div>
      <div class="profit"><span>กำไร</span><b id="tProfit">0</b></div>
    </div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs"><div class="in" role="tablist">
  <button role="tab" data-tab="sell" aria-selected="true">เมนู</button>
  <button role="tab" data-tab="buy">วัตถุดิบ</button>
  <button role="tab" data-tab="sum">สรุป</button>
  <button role="tab" data-tab="set">ตั้งค่า</button>
</div></nav>
<div class="toast" id="toast" role="status"></div>
<div class="sheet" id="sheet" hidden><div class="sheet-box" role="alertdialog" aria-modal="true" aria-labelledby="sheetMsg">
  <p id="sheetMsg"></p><div class="sheet-btns"><button class="ghost" id="sheetNo">ยกเลิก</button><button class="danger" id="sheetYes">ลบ</button></div>
</div></div>

<script type="module">
/* ============================================================
   การตั้งค่าทั้งหมดอยู่ในไฟล์ config.js (อัปโหลดไว้คู่กับ index.html ครั้งเดียว)
   เวลาอัปเดตแอป อัปโหลดแค่ index.html ไฟล์ config.js ไม่ต้องแตะอีก
   ============================================================ */
const CFG=await import('./config.js?v='+Date.now()).then(m=>m.default||{}).catch(()=>({}));
// a "setup link" (#setup=...) from another device stores the Firebase settings on this device
(()=>{const m=location.hash.match(/^#setup=(.+)$/);if(!m)return;
  try{const v=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));if(v&&v.firebase&&v.firebase.projectId)localStorage.setItem('maidet-fb',JSON.stringify(v.firebase));}catch(e){}
  history.replaceState(null,'',location.pathname+location.search);})();
const LOCAL_FB=(()=>{try{return JSON.parse(localStorage.getItem('maidet-fb')||'null');}catch(e){return null;}})();
const FB_KEYS=['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId'];
const CFG_FOUND=Object.keys(CFG).length>0;
const FB={step:'',err:'',items:null,writeOk:null};
function fbMsg(e){
  const c=(e&&e.code)||'',m=(e&&e.message)||String(e);
  if(/operation-not-allowed|admin-restricted/.test(c))return 'ยังไม่ได้เปิด Anonymous ใน Firebase > Authentication > Sign-in method';
  if(/invalid-api-key|api-key-not-valid/.test(c+m))return 'apiKey ใน config.js ไม่ถูกต้อง';
  if(/permission-denied/.test(c))return 'Firestore Rules ไม่อนุญาต ให้วาง Rules ตามคู่มือแล้วกด Publish';
  if(/not-found/.test(c)||/does not exist/i.test(m))return 'ยังไม่ได้สร้าง Firestore Database ในโปรเจกต์ Firebase';
  if(/unauthenticated/.test(c))return 'ยังไม่ได้เข้าสู่ระบบ Firebase (ตรวจการเปิด Anonymous)';
  if(/network|unavailable|Failed to fetch/i.test(c+m))return 'ต่อเน็ตไม่ได้';
  if(/requests-from-referer|referer/i.test(m))return 'apiKey ถูกจำกัดโดเมน เพิ่มโดเมน github.io ใน Google Cloud Console';
  return (c?c+': ':'')+m;
}
function fbFail(e){FB.err=fbMsg(e);setStatus('ไม่ซิงก์: '+FB.err);scheduleRender();}
const SHEET_URL = String(CFG.sheetUrl||'https://script.google.com/macros/s/AKfycbzy1vQekAn7qzjMeuFI4q4LBbDmohQYgq3rKyqn4-XLjzDF0pnVWRH5FkxMGcXYWICtTw/exec').trim();   // ล็อกไว้ในเว็บ
const SHEET_TOKEN = String(CFG.sheetToken||'01201776').trim();
/* Data model (multi-device safe):
   items/{id}              {name,cat,price,cost,base,net0,order}   rarely edited
   devices/{dev}           {sold:{id:n}, bought:{id:n}}              only that device writes
   days/{day}/by/{dev}     {sales:{id:{q,rev,cost}}, buys:[], exp:[]} only that device writes
   stock = base + (Σbought − Σsold across devices) − net0                              */
const CATS=[{id:'grill',name:'ของเสียบย่าง'},{id:'ball',name:'ลูกชิ้น'}];
const LS_KEY='grill-shop-v2';
let ITEMS={}, RAWS={}, DEV={}, DAYS={};
let ME=(()=>{try{let v=localStorage.getItem('grill-dev');if(!v){v='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);localStorage.setItem('grill-dev',v);}return v;}catch(e){return 'd'+Math.random().toString(36).slice(2,10);}})();
let db=null, online=false, tab='sell', catFilter='all', query='', viewDay=dkey(new Date());
const dayLoaded={}, daySubs={};

function dkey(d){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());}
function today(){return dkey(new Date());}
function emptyDay(){return {sales:{},buys:[],exp:[]};}
function r2(n){return Math.round(n*100)/100;}
function fmt(n){return (Number(n)||0).toLocaleString('th-TH',{maximumFractionDigits:2});}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function clone(o){return JSON.parse(JSON.stringify(o));}
function uid(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),1800);}
function setStatus(s){document.getElementById('status').textContent=s;}

function myDev(){if(!DEV[ME])DEV[ME]={sold:{},bought:{},rawIn:{},rawOut:{},rawUse:{}};return DEV[ME];}
function myDay(k){if(!DAYS[k])DAYS[k]={};if(!DAYS[k][ME])DAYS[k][ME]=emptyDay();return DAYS[k][ME];}
function itemList(){return Object.entries(ITEMS).map(([id,v])=>({id,...v})).sort((a,b)=>(a.order||0)-(b.order||0));}
function net(id){let n=0;for(const d of Object.values(DEV)){n+=(d.bought&&d.bought[id]||0)-(d.sold&&d.sold[id]||0);}return n;}
function stock(id){const it=ITEMS[id];return it?Math.round((it.base||0)+net(id)-(it.net0||0)):0;}
function ask(msg,yes){
  return new Promise(res=>{
    const sh=document.getElementById('sheet'),y=document.getElementById('sheetYes'),n=document.getElementById('sheetNo');
    document.getElementById('sheetMsg').textContent=msg;y.textContent=yes||'ลบ';sh.hidden=false;y.focus();
    const done=v=>{sh.hidden=true;y.onclick=n.onclick=sh.onclick=null;res(v);};
    y.onclick=()=>done(true);n.onclick=()=>done(false);sh.onclick=e=>{if(e.target===sh)done(false);};
  });
}
function dayAgg(k){
  const out={sales:{},buys:[],exp:[],prods:[]},gone=new Set();
  for(const d of Object.values(DAYS[k]||{}))(d.voids||[]).forEach(v=>gone.add(v));
  for(const [dev,d] of Object.entries(DAYS[k]||{})){
    for(const [id,r] of Object.entries(d.sales||{})){const o=out.sales[id]||(out.sales[id]={q:0,rev:0,cost:0});o.q+=r.q;o.rev+=r.rev;o.cost+=r.cost;}
    (d.buys||[]).forEach(b=>{const key=dev+':buy:'+b.t;if(!gone.has(key))out.buys.push({...b,dev,key});});
    (d.exp||[]).forEach(b=>{const key=dev+':exp:'+b.t;if(!gone.has(key))out.exp.push({...b,dev,key});});
    (d.prods||[]).forEach(b=>{const key=dev+':prod:'+b.t;if(!gone.has(key))out.prods.push({...b,dev,key});});
  }
  return out;
}

/* ---------- storage ---------- */
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify({ITEMS,RAWS,DEV,DAYS}));}catch(e){}}
function loadLocal(){try{const v=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(v){ITEMS=v.ITEMS||{};RAWS=v.RAWS||{};DEV=v.DEV||{};DAYS=v.DAYS||{};}}catch(e){}}
const pend={},busy={};
function save(path,getData){pend[path]=getData;saveLocal();flush(path);}
async function flush(path){
  if(!db||busy[path]||!pend[path])return;
  const g=pend[path];pend[path]=null;busy[path]=true;
  try{await db.doc(path).set(clone(g()));FB.writeOk=true;if(FB.err&&/Rules|Database|เข้าสู่ระบบ/.test(FB.err))FB.err='';setStatus('ซิงก์แล้ว');}
  catch(e){
    if(!e||e.code==='unavailable'||e.code==='resource_exhausted'){pend[path]=pend[path]||g;busy[path]=false;setStatus('กำลังส่งข้อมูล…');setTimeout(()=>flush(path),800+Math.random()*1200);return;}
    FB.err=fbMsg(e);FB.writeOk=false;setStatus('ไม่ซิงก์: '+FB.err);if(!flush.warned){toast('บันทึกขึ้นระบบไม่สำเร็จ: '+FB.err);flush.warned=1;}pend[path]=pend[path]||g;busy[path]=false;setTimeout(()=>flush(path),15000);scheduleRender();return;
  }
  busy[path]=false;flush(path);
}
function saveDev(quiet){save('devices/'+ME,()=>myDev());if(!quiet)sheetStockMark();}
function saveDay(k){save('days/'+k+'/by/'+ME,()=>myDay(k));sheetMark(k);}
async function itemWrite(id,fields,isNew){
  sheetStockMark();
  ITEMS[id]=Object.assign(ITEMS[id]||{},fields);saveLocal();
  if(!db)return;
  try{isNew?await db.doc('items/'+id).set(clone(ITEMS[id])):await db.doc('items/'+id).update(clone(fields));}
  catch(e){toast('บันทึกสินค้าไม่สำเร็จ ลองอีกครั้ง');}
}
async function itemDelete(id){delete ITEMS[id];saveLocal();if(db){try{await db.doc('items/'+id).delete();}catch(e){toast('ลบไม่สำเร็จ');}}}

/* ---------- live sync ---------- */
function subscribeDay(k){ /* errors reported via fbFail */
  if(!db||daySubs[k])return;
  daySubs[k]=db.collection('days/'+k+'/by').onSnapshot(snap=>{
    const m=DAYS[k]||(DAYS[k]={});
    for(const ch of snap.docChanges()){
      const id=ch.doc.id;
      if(id===ME&&dayLoaded[k])continue;          // this device is the only writer of its own doc
      if(ch.type==='removed')delete m[id];else m[id]=Object.assign(emptyDay(),clone(ch.doc.data()));
    }
    dayLoaded[k]=true;saveLocal();scheduleRender();
  },fbFail);
}
function startSync(){
  let devLoaded=false;
  db.collection('items').onSnapshot(snap=>{
    const n={};snap.docs.forEach(d=>n[d.id]=clone(d.data()));
    if(snap.metadata&&snap.metadata.fromCache&&!snap.docs.length&&Object.keys(ITEMS).length)return; // wait for server
    ITEMS=n;FB.items=snap.docs.length;if(!FB.err)setStatus('ซิงก์แล้ว');saveLocal();scheduleRender();
  },fbFail);
  if(!SHEET_LOCKED)db.collection('config').onSnapshot(snap=>{
    const d=snap.docs.find(x=>x.id==='sheet');const was=sheetOn();
    SHEETCFG=d?clone(d.data()):{};sheetPersist();
    if(!was&&sheetOn()){sheetMark(today());sheetStockDirty=true;}
    if(tab==='set')scheduleRender();
  },()=>{});
  db.collection('raws').onSnapshot(snap=>{
    const n={};snap.docs.forEach(d=>n[d.id]=clone(d.data()));RAWS=n;saveLocal();scheduleRender();
  },fbFail);
  db.collection('devices').onSnapshot(snap=>{
    for(const ch of snap.docChanges()){
      const id=ch.doc.id;
      if(id===ME&&devLoaded)continue;
      if(ch.type==='removed')delete DEV[id];else DEV[id]=Object.assign({sold:{},bought:{}},clone(ch.doc.data()));
    }
    devLoaded=true;saveLocal();scheduleRender();renderPeers();
  },fbFail);
  subscribeDay(today());
}
let renderPending=false;
function editing(){const a=document.activeElement;return a&&a.id!=='q'&&document.getElementById('view').contains(a)&&/INPUT|SELECT/.test(a.tagName);}
function scheduleRender(){renderTill();if(editing()){renderPending=true;return;}render();}

/* ---------- totals ---------- */
function totals(k){
  const d=dayAgg(k);let rev=0,cost=0,qty=0;
  for(const r of Object.values(d.sales)){rev+=r.rev;cost+=r.cost;qty+=r.q;}
  const buys=d.buys.reduce((a,b)=>a+b.total,0),exp=d.exp.reduce((a,b)=>a+b.total,0);
  return {rev:r2(rev),cost:r2(cost),profit:r2(rev-cost),qty,buys:r2(buys),exp:r2(exp),cash:r2(rev-buys-exp)};
}
function renderTill(){
  const t=totals(today());
  document.getElementById('tRev').textContent=fmt(t.rev);
  document.getElementById('tCost').textContent=fmt(t.cost);
  document.getElementById('tProfit').textContent=fmt(t.profit);
}

/* ---------- picture menu (sell / add stock) ---------- */
let mode='sell', step=1;
function addStock(id,n){
  const it=ITEMS[id];if(!it)return;
  const st=stock(id);if(n<0)n=-Math.min(-n,Math.max(0,st));if(!n)return;
  const dv=myDev();dv.bought[id]=(dv.bought[id]||0)+n;
  const k=today(),mine=myDay(k);mine.adds=mine.adds||{};mine.adds[id]=(mine.adds[id]||0)+n;
  saveDev();saveDay(k);
}
function sell(id,d){
  const it=ITEMS[id];if(!it)return false;
  const k=today(),mine=myDay(k),r=mine.sales[id]||{q:0,rev:0,cost:0},dv=myDev();
  if(d>0){
    if(stock(id)<=0){toast(it.name+' หมดแล้ว สลับไปโหมด "เติมสต็อก"');return false;}
    r.q++;r.rev=r2(r.rev+(+it.price||0));r.cost=r2(r.cost+(+it.cost||0));dv.sold[id]=(dv.sold[id]||0)+1;
  }else{
    const agg=dayAgg(k).sales[id];
    if(!agg||agg.q<=0)return false;
    r.q--;r.rev=r2(r.rev-agg.rev/agg.q);r.cost=r2(r.cost-agg.cost/agg.q);dv.sold[id]=(dv.sold[id]||0)-1;
  }
  mine.sales[id]=r;saveDev();saveDay(k);return true;
}
function tap(id,sign){
  let ok=true;
  if(mode==='sell')ok=sell(id,sign);else addStock(id,sign*step);
  renderTill();
  const t=document.querySelector('[data-row="'+id+'"]');
  if(t){t.outerHTML=tile({id,...ITEMS[id]});if(ok&&sign>0){const n=document.querySelector('[data-row="'+id+'"] .tap');n&&n.classList.add('pop');}}
}
function pic(it,cls){
  return it.img?'<img class="'+cls+'" src="'+it.img+'" alt="">':'<span class="'+cls+' ph ph-'+it.cat+'">'+esc([...(it.name||'?')][0])+'</span>';
}
function tile(it){
  const st=stock(it.id),r=dayAgg(today()).sales[it.id],q=r?r.q:0;
  const stTxt=st<=0?'<span class="out">หมด</span>':st<=3?'<span class="low">เหลือ '+st+'</span>':'เหลือ '+st;
  const badge=mode==='sell'?(q?'<span class="badge">ขาย '+q+'</span>':''):'<span class="badge add">+'+step+'</span>';
  const dis=mode==='sell'&&st<=0;
  return '<div class="tile'+(dis?' off':'')+'" data-row="'+it.id+'">'+
    '<button class="tap" data-act="tap" data-id="'+it.id+'" aria-label="'+(mode==='sell'?'ขาย ':'เติมสต็อก ')+esc(it.name)+'">'+pic(it,'pic')+badge+
    '<span class="tname">'+esc(it.name)+'</span><span class="tmeta">'+stTxt+(it.price>0?'  ฿'+fmt(it.price):'')+'</span></button>'+
    '<button class="minus" data-act="minus" data-id="'+it.id+'" aria-label="'+(mode==='sell'?'ยกเลิกขาย ':'ลดสต็อก ')+esc(it.name)+'">−</button></div>';
}
function viewSell(){
  const items=itemList();
  let h=syncBanner()+'<div class="modes" role="group" aria-label="โหมด"><button data-mode="sell" aria-pressed="'+(mode==='sell')+'">ขาย</button><button data-mode="stock" aria-pressed="'+(mode==='stock')+'">เติมสต็อก</button></div>';
  if(mode==='stock')h+='<div class="steps">แตะรูป 1 ครั้ง เพิ่ม '+[1,5,10].map(n=>'<button class="chip" data-step="'+n+'" aria-pressed="'+(step===n)+'">'+n+' ไม้</button>').join('')+'</div>';
  else h+='<p class="hint">แตะรูปเพื่อขาย 1 ไม้  กด − เพื่อยกเลิก</p>';
  h+='<div class="bar"><input class="search" id="q" type="search" placeholder="ค้นหาสินค้า" value="'+esc(query)+'"></div>';
  h+='<div class="chips">'+[{id:'all',name:'ทั้งหมด'},...CATS].map(c=>'<button class="chip" data-cat="'+c.id+'" aria-pressed="'+(catFilter===c.id)+'">'+c.name+'</button>').join('')+'</div>';
  if(!items.length)return h+'<div class="card empty">'+(online||!db?'ยังไม่มีสินค้า<br><button class="primary" data-act="seed">ใส่รายการสินค้าเริ่มต้น (49 รายการ)</button><br>หรือเพิ่มเองที่แท็บ "ตั้งค่า"':'กำลังโหลดสินค้า…')+'</div>';
  if(mode==='sell'&&items.some(i=>!(i.price>0)))h+='<div class="banner">บางรายการยังไม่ได้ตั้งราคาขาย ไปตั้งที่แท็บ "ตั้งค่า"</div>';
  const q=query.trim(),list=items.filter(i=>(catFilter==='all'||i.cat===catFilter)&&(!q||i.name.includes(q)));
  for(const c of CATS){
    const its=list.filter(i=>i.cat===c.id);if(!its.length)continue;
    const left=its.reduce((a,i)=>a+Math.max(0,stock(i.id)),0);
    h+='<h2 class="cat"><span>'+c.name+'</span><span>รวมเหลือ '+left+' ไม้</span></h2><div class="grid mode-'+mode+'">'+its.map(tile).join('')+'</div>';
  }
  if(!list.length)h+='<div class="card empty">ไม่พบสินค้าที่ค้นหา</div>';
  return h;
}

const UNITS=['กก.','ขีด','แพ็ค','ถุง','กล่อง','ชิ้น','ลูก','กำ','ขวด'];
const R3=n=>Math.round(n*1000)/1000;
function rawList(){return Object.entries(RAWS).map(([id,v])=>({id,...v})).sort((a,b)=>(a.order||0)-(b.order||0));}
function rawNet(id){let n=0;for(const d of Object.values(DEV)){n+=((d.rawIn||{})[id]||0)-((d.rawOut||{})[id]||0);}return n;}
function rawStock(id){const r=RAWS[id];return r?R3((r.base||0)+rawNet(id)-(r.net0||0)):0;}
function rawUsage(id){const u={};for(const d of Object.values(DEV)){const m=(d.rawUse||{})[id]||{};for(const [it,q] of Object.entries(m))u[it]=(u[it]||0)+q;}return u;}
async function rawWrite(id,fields,isNew){
  sheetStockMark();
  RAWS[id]=Object.assign(RAWS[id]||{},fields);saveLocal();
  if(!db)return;
  try{isNew?await db.doc('raws/'+id).set(clone(RAWS[id])):await db.doc('raws/'+id).update(clone(fields));}
  catch(e){toast('บันทึกวัตถุดิบไม่สำเร็จ ลองอีกครั้ง');}
}
async function rawDelete(id){delete RAWS[id];saveLocal();if(db){try{await db.doc('raws/'+id).delete();}catch(e){toast('ลบไม่สำเร็จ');}}}

function setPath(path,val){const ks=path.split('.');let o=RS;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=val;}
function makeCost(){
  let total=0,missing=false,over=[];
  for(const l of RS.make.lines){if(!l.raw||!(+l.qty>0))continue;const r=RAWS[l.raw];if(!r)continue;if(!(r.cost>0))missing=true;total+=(+l.qty)*(r.cost||0);if(+l.qty>rawStock(l.raw)+1e-9)over.push(r.name);}
  return {total:r2(total),missing,over};
}
function updateRawCalc(){
  const el=document.getElementById('rCalc');if(!el)return;
  if(RS.mode==='buy'){
    const b=RS.buy,q=+b.qty,t=+b.total,isNew=b.raw==='__new',unit=isNew?b.unit:unitOf(b.raw);
    if(!(q>0&&t>0)){el.innerHTML='ใส่จำนวนที่ซื้อกับเงินที่จ่าย';return;}
    let s=esc(unit||'หน่วย')+'ละ <b>฿'+fmt(t/q)+'</b>';
    if(!isNew){const r=RAWS[b.raw],st=rawStock(b.raw);if(r&&st>0&&r.cost>0)s+='<br>รวมกับของเดิม '+fmt(st)+' '+esc(unit)+' ทุนเฉลี่ยใหม่ ฿'+fmt((st*r.cost+t)/(st+q))+'/'+esc(unit);}
    el.innerHTML=s;return;
  }
  if(RS.mode==='make'){
    const q=+RS.make.qty,it=ITEMS[RS.make.item],c=makeCost();
    if(!it||!(q>0)){el.innerHTML='เลือกเมนูและใส่จำนวนไม้ที่ทำได้';return;}
    if(!(c.total>0)){el.innerHTML='ใส่วัตถุดิบที่ใช้และจำนวน';return;}
    const per=c.total/q;
    let s='ต้นทุนวัตถุดิบรวม <b>฿'+fmt(c.total)+'</b>  ทุนไม้ละ <b>฿'+fmt(per)+'</b>';
    if(it.price>0){const p=it.price-per;s+='<br>ขายไม้ละ ฿'+fmt(it.price)+' กำไรไม้ละ <b>฿'+fmt(p)+'</b> ขายหมด '+q+' ไม้ กำไร <b>฿'+fmt(p*q)+'</b>';}
    if(c.missing)s+='<br><span class="warn">วัตถุดิบบางอย่างยังไม่มีราคาทุน ต้นทุนอาจต่ำกว่าจริง</span>';
    if(c.over.length)s+='<br><span class="warn">ใช้เกินที่มีในคลัง: '+c.over.map(esc).join(', ')+'</span>';
    el.innerHTML=s;
  }
}
function fillRecipe(){

  RS.make.lines=it.recipe.filter(x=>RAWS[x.raw]).map(x=>({raw:x.raw,qty:q>0?String(R3(x.per*q)):''}));

}
async function saveRawBuy(){
  const b=RS.buy,q=R3(+b.qty),t=r2(+b.total);

    else{id='r'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);

function saveMake(){
  const m=RS.make,q=Math.round(+m.qty),it=ITEMS[m.item];
  if(!it){toast('เลือกเมนู');return;}
  if(!(q>0)){toast('ใส่จำนวนไม้ที่ทำได้');return;}
  const lines=m.lines.filter(l=>l.raw&&RAWS[l.raw]&&+l.qty>0);
  if(!lines.length){toast('ใส่วัตถุดิบที่ใช้อย่างน้อย 1 อย่าง');return;}
  const dv=myDev();dv.rawOut=dv.rawOut||{};dv.rawUse=dv.rawUse||{};
  const used=lines.map(l=>{const r=RAWS[l.raw],qty=R3(+l.qty),cost=r2(qty*(r.cost||0));
    bump(dv.rawOut,l.raw,qty);dv.rawUse[l.raw]=dv.rawUse[l.raw]||{};bump(dv.rawUse[l.raw],m.item,qty);
    return {raw:l.raw,qty,unit:r.unit,cost};});
  const total=r2(used.reduce((a,u)=>a+u.cost,0)),per=total/q,st=stock(m.item);
  const fields={recipe:used.map(u=>({raw:u.raw,per:u.qty/q}))};
  if(m.avg&&total>0)fields.cost=r2(st>0&&it.cost>0?(st*it.cost+total)/(st+q):per);
  itemWrite(m.item,fields);
  bump(dv.bought,m.item,q);saveDev();
  const k=today(),mine=myDay(k);mine.prods=mine.prods||[];mine.prods.push({t:Date.now(),item:m.item,qty:q,used,total});saveDay(k);
  toast('เพิ่ม '+it.name+' '+q+' ไม้เข้าสต็อกแล้ว');
  RS.make={item:'',qty:'',lines:[{raw:'',qty:''}],auto:false,avg:m.avg};render();
}
function saveExp(){
  const t=r2(+RS.exp.total);if(!(t>0)){toast('ใส่จำนวนเงิน');return;}

async function delBuy(key){
  const k=today(),d=dayAgg(k),r=[...d.buys,...d.exp,...d.prods].find(x=>x.key===key);if(!r)return;
  const kind=key.split(':')[1];
  let msg='ลบรายการนี้?';
  if(kind==='prod')msg='ลบรายการทำ '+((ITEMS[r.item]||{}).name||'')+' '+r.qty+' ไม้? สต็อกเมนูจะลดลง และวัตถุดิบจะคืนเข้าคลัง';
  else if(kind==='buy'&&r.raw)msg='ลบการซื้อ '+((RAWS[r.raw]||{}).name||'')+' '+fmt(r.qty)+' '+(r.unit||'')+'? วัตถุดิบในคลังจะลดลงตามนี้';
  else if(kind==='buy')msg='ลบรายการนี้? สต็อก '+((ITEMS[r.item]||{}).name||'')+' จะลดลง '+r.qty+' ไม้';
  else msg='ลบค่าใช้จ่าย "'+(r.desc||'ไม่ระบุ')+'"?';
  if(!await ask(msg))return;
  const dv=myDev();dv.rawIn=dv.rawIn||{};dv.rawOut=dv.rawOut||{};dv.rawUse=dv.rawUse||{};
  if(kind==='prod'){bump(dv.bought,r.item,-r.qty);for(const u of r.used||[]){bump(dv.rawOut,u.raw,-u.qty);dv.rawUse[u.raw]=dv.rawUse[u.raw]||{};bump(dv.rawUse[u.raw],r.item,-u.qty);}saveDev();}
  else if(kind==='buy'&&r.raw){bump(dv.rawIn,r.raw,-r.qty);saveDev();}
  else if(kind==='buy'&&r.item){bump(dv.bought,r.item,-r.qty);saveDev();}
  const mine=myDay(k);mine.voids=mine.voids||[];mine.voids.push(key);saveDay(k);
  toast('ลบแล้ว');render();
}

  // daily chart
  const all=[];for(let d=1;d<=new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();d++)all.push(ym+'-'+String(d).padStart(2,'0'));

  const W=all.length*14,H=120;
  h+='<div class="card"><h3>ยอดขายและกำไรรายวัน</h3><div class="legend"><span class="sw rev"></span>ยอดขาย <span class="sw pro"></span>กำไร</div><div class="tbl-wrap"><svg class="chart" viewBox="0 0 '+W+' '+(H+16)+'" preserveAspectRatio="none" role="img" aria-label="กราฟยอดขายรายวัน">'+
    all.map((k,i)=>{const t=byK[k],x=i*14+2;if(!t)return '';const hr=t.rev/max*H,hp=Math.max(0,t.profit)/max*H;
      return '<g class="bar" data-goday="'+k+'"><title>'+Number(k.slice(8))+': ขาย ฿'+fmt(t.rev)+' กำไร ฿'+fmt(t.profit)+'</title><rect x="'+(x-2)+'" y="0" width="14" height="'+H+'" fill="transparent"/>'+
        '<rect class="rv" x="'+x+'" y="'+(H-hr)+'" width="10" height="'+hr+'" rx="2"/><rect class="pf" x="'+(x+2)+'" y="'+(H-hp)+'" width="6" height="'+hp+'" rx="1"/></g>';}).join('')+
    all.map((k,i)=>{const d=i+1;return (d===1||d%5===0)?'<text x="'+(i*14+7)+'" y="'+(H+13)+'" text-anchor="middle">'+d+'</text>':'';}).join('')+
    '</svg></div><p class="note" style="margin-top:4px">แตะแท่งเพื่อดูรายละเอียดวันนั้น</p></div>';

  // items
  const items={};
  const rawAgg={};
  for(const k of days){
    const d=dayAgg(k);
    for(const [id,r] of Object.entries(d.sales)){const o=items[id]||(items[id]={q:0,rev:0,cost:0});o.q+=r.q;o.rev+=r.rev;o.cost+=r.cost;}
    for(const b of d.buys)if(b.raw){const t=rawAgg[b.raw]||(rawAgg[b.raw]={q:0,total:0,use:{}});t.q+=b.qty;t.total+=b.total;}
    for(const p of d.prods)for(const u of p.used||[]){const t=rawAgg[u.raw]||(rawAgg[u.raw]={q:0,total:0,use:{}});const x=t.use[p.item]||(t.use[p.item]={q:0,made:0});x.q+=u.qty;x.made+=p.qty;}
  }
  const top=Object.entries(items).filter(([,r])=>r.q>0).map(([id,r])=>({name:(ITEMS[id]||{name:'สินค้าที่ลบแล้ว'}).name,...r,p:r.rev-r.cost})).sort((a,b)=>b.p-a.p);
  h+='<div class="card"><h3>เมนูที่ขายในเดือนนี้</h3>'+(top.length?'<div class="tbl-wrap"><table><thead><tr><th>เมนู</th><th>ไม้</th><th>ยอดขาย</th><th>กำไร</th></tr></thead><tbody>'+
    top.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+fmt(r.q)+'</td><td>'+fmt(r.rev)+'</td><td>'+fmt(r.p)+'</td></tr>').join('')+'</tbody></table></div><p class="note">เรียงจากเมนูที่ทำกำไรมากที่สุด</p>':'<div class="empty">เดือนนี้ยังไม่มียอดขาย</div>')+'</div>';

  const ra=Object.entries(rawAgg);
  if(ra.length)h+='<div class="card"><h3>วัตถุดิบเดือนนี้ ซื้อเท่าไหร่ ทำอะไรไป</h3>'+ra.sort((a,b)=>b[1].total-a[1].total).map(([rid,t])=>{const r=RAWS[rid]||{name:'วัตถุดิบที่ลบแล้ว',unit:''};
    return '<div class="trace"><div class="name">'+esc(r.name)+(t.q?' <span class="meta">ซื้อ '+fmt(t.q)+' '+esc(r.unit)+' ฿'+fmt(t.total)+'</span>':'')+'</div>'+
      Object.entries(t.use).map(([it,x])=>'<div class="meta">→ '+esc((ITEMS[it]||{name:'เมนูที่ลบแล้ว'}).name)+' '+fmt(x.made)+' ไม้ (ใช้ '+fmt(x.q)+' '+esc(r.unit)+')</div>').join('')+'</div>';}).join('')+'</div>';

  const exps=[];for(const k of days)for(const e of dayAgg(k).exp)exps.push(e);
  if(exps.length){const g={};for(const e of exps){const n=(e.desc||'ไม่ระบุ');g[n]=(g[n]||0)+e.total;}
    h+='<div class="card"><h3>ค่าใช้จ่ายอื่น ฿'+fmt(sum.exp)+'</h3><div class="tbl-wrap"><table><tbody>'+Object.entries(g).sort((a,b)=>b[1]-a[1]).map(([n,v])=>'<tr><td>'+esc(n)+'</td><td>'+fmt(v)+'</td></tr>').join('')+'</tbody></table></div></div>';}
  return h;
}

/* ---------- Google Sheet sync ---------- */
let SHEETCFG=(()=>{try{return JSON.parse(localStorage.getItem('maidet-sheet-cfg')||'{}');}catch(e){return {};}})();
const SHEET_LOCKED=!!(SHEET_URL&&SHEET_TOKEN);
if(SHEET_LOCKED)SHEETCFG={url:SHEET_URL.trim(),token:SHEET_TOKEN.trim(),link:SHEETCFG.url===SHEET_URL.trim()?(SHEETCFG.link||''):''};
let sheetSent=(()=>{try{return JSON.parse(localStorage.getItem('maidet-sheet-sent')||'{}');}catch(e){return {};}})();
let sheetDirty=new Set((()=>{try{return JSON.parse(localStorage.getItem('maidet-sheet-dirty')||'[]');}catch(e){return [];}})());
let sheetStockDirty=false,sheetLastStock=0,sheetTimer=null,sheetBusy=false,sheetInfo='';
function sheetOn(){return !!(SHEETCFG.url&&SHEETCFG.token);}
function sheetPersist(){try{localStorage.setItem('maidet-sheet-sent',JSON.stringify(sheetSent));localStorage.setItem('maidet-sheet-dirty',JSON.stringify([...sheetDirty]));localStorage.setItem('maidet-sheet-cfg',JSON.stringify(SHEETCFG));}catch(e){}}
function sheetMark(k){if(!sheetOn())return;sheetDirty.add(k);sheetPersist();sheetSchedule();}
function sheetStockMark(){if(!sheetOn())return;sheetStockDirty=true;sheetSchedule();}
function sheetSchedule(ms){clearTimeout(sheetTimer);sheetTimer=setTimeout(sheetFlush,ms??2500);}
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=(h*33^s.charCodeAt(i))>>>0;return h.toString(36);}
function hhmm(t){const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function devName(dev){return (DEV[dev]&&DEV[dev].name)||('เครื่อง '+dev.slice(-4));}
function catName(id){const c=CATS.find(c=>c.id===id);return c?c.name:'';}
function sheetRows(k,devs){
  const out={sales:[],buys:[],prods:[],uses:[],exp:[],voided:[]},gone=new Set(),month=k.slice(0,7);
  for(const d of Object.values(DAYS[k]||{}))(d.voids||[]).forEach(v=>gone.add(v));
  for(const dev of devs){
    const d=DAYS[k]&&DAYS[k][dev];if(!d)continue;const device=devName(dev);
    for(const [id,r] of Object.entries(d.sales||{})){
      const key=k+'|'+dev+'|'+id;
      if(!(r.q>0)){out.sales.push({key,del:true});continue;}
      const it=ITEMS[id]||{};
      out.sales.push({key,date:k,month,device,item:it.name||'(ลบแล้ว)',cat:catName(it.cat),q:r.q,rev:r2(r.rev),cost:r2(r.cost)});
    }
    for(const b of d.buys||[]){
      const key=dev+':buy:'+b.t;if(gone.has(key))continue;
      const name=b.raw?((RAWS[b.raw]||{}).name||'(ลบแล้ว)'):'(เมนู) '+((ITEMS[b.item]||{}).name||'');
      out.buys.push({key,date:k,month,time:hhmm(b.t),device,name,qty:b.qty,unit:b.raw?(b.unit||''):'ไม้',total:b.total});
    }
    for(const p of d.prods||[]){
      const key=dev+':prod:'+p.t;if(gone.has(key))continue;
      const item=(ITEMS[p.item]||{}).name||'(ลบแล้ว)';
      const used=(p.used||[]).map(u=>((RAWS[u.raw]||{}).name||'?')+' '+fmt(u.qty)+' '+(u.unit||'')).join(', ');
      out.prods.push({key,date:k,month,time:hhmm(p.t),device,item,qty:p.qty,used,total:p.total});
      for(const u of p.used||[])out.uses.push({key:key+'|'+u.raw,date:k,month,time:hhmm(p.t),device,item,raw:(RAWS[u.raw]||{}).name||'(ลบแล้ว)',qty:u.qty,unit:u.unit||'',cost:u.cost});
    }
    for(const e of d.exp||[]){
      const key=dev+':exp:'+e.t;if(gone.has(key))continue;
      out.exp.push({key,date:k,month,time:hhmm(e.t),device,desc:e.desc||'ไม่ระบุ',total:e.total});
    }
  }
  out.voided=[...gone];
  return out;
}
// keep only rows that changed since the last successful send
function sheetDiff(rows,day){
  const p={},marks=[];let n=0;
  for(const f of ['sales','buys','prods','uses','exp']){
    p[f]=rows[f].filter(r=>{const h=hash(JSON.stringify(r));if(sheetSent[r.key]&&sheetSent[r.key][0]===h)return false;marks.push([r.key,h]);return true;});n+=p[f].length;
  }
  p.voided=rows.voided.filter(v=>{if(sheetSent['v:'+v])return false;marks.push(['v:'+v,'1']);return true;});n+=p.voided.length;
  return {p,marks,n,day};
}
function stockPayload(){
  return {items:itemList().map(i=>({name:i.name,cat:catName(i.cat),stock:stock(i.id),price:+i.price||0,cost:+i.cost||0})),
          raws:rawList().map(r=>({name:r.name,unit:r.unit||'',stock:rawStock(r.id),cost:+r.cost||0}))};
}
async function sheetPost(payload){
  const body=JSON.stringify({token:SHEETCFG.token,...payload});
  let r;
  try{r=await fetch(SHEETCFG.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body,redirect:'follow'});}
  catch(e){ // some browsers block reading the reply; the script is idempotent, so a blind send is safe
    await fetch(SHEETCFG.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body});return {ok:true,blind:true};
  }
  let j;try{j=await r.json();}catch(e){throw new Error('ลิงก์ไม่ใช่ Web app ของ Apps Script หรือยังไม่ได้ตั้งสิทธิ์เป็น Anyone');}
  if(!j.ok)throw new Error(j.error||'ส่งไม่สำเร็จ');
  if(j.sheet&&j.sheet!==SHEETCFG.link){SHEETCFG.link=j.sheet;sheetSaveCfg();}
  return j;
}
function sheetCommit(marks,day){
  const now=Date.now();for(const [k,h] of marks)sheetSent[k]=[h,day||now];
  // forget marks older than ~60 days so storage stays small
  const cut=dkey(new Date(now-60*864e5));
  for(const [k,v] of Object.entries(sheetSent))if(typeof v[1]==='string'&&v[1]<cut)delete sheetSent[k];
  sheetPersist();
}
async function sheetFlush(){
  if(!sheetOn()||sheetBusy)return;
  if(!sheetDirty.size&&!sheetStockDirty)return;
  sheetBusy=true;
  try{
    for(const k of [...sheetDirty]){
      const d=sheetDiff(sheetRows(k,[ME]),k);
      if(d.n)await sheetPost(d.p);
      sheetCommit(d.marks,k);sheetDirty.delete(k);sheetPersist();
    }
    if(sheetStockDirty&&Date.now()-sheetLastStock>60000){await sheetPost({stock:stockPayload()});sheetStockDirty=false;sheetLastStock=Date.now();}
    sheetInfo='ส่งเข้า Sheet ล่าสุด '+hhmm(Date.now());
  }catch(e){sheetInfo='ส่งเข้า Sheet ไม่สำเร็จ: '+e.message+' (จะลองใหม่เอง)';sheetSchedule(60000);}
  sheetBusy=false;
  if(sheetStockDirty)sheetSchedule(65000);
  const el=document.getElementById('shStatus');if(el)el.textContent=sheetInfo;
}
async function sheetSaveCfg(){
  sheetPersist();
  if(SHEET_LOCKED)return;
  if(db){try{await db.doc('config/sheet').set(clone(SHEETCFG));}catch(e){}}
}

    sheetMark(today());sheetStockDirty=true;sheetLastStock=0;sheetSchedule(500);}
  catch(e){SHEETCFG=old;sheetInfo='เชื่อมไม่สำเร็จ: '+e.message;toast('เชื่อมไม่สำเร็จ');}
  render();
}
async function sheetBackfill(){
  if(!sheetOn()){toast('เชื่อม Google Sheet ก่อน');return;}
  const ym=today().slice(0,7),days=monthDays(ym);
  if(!await ask('ส่งข้อมูลของทุกเครื่องทั้งเดือน '+monthLabel(ym)+' เข้า Google Sheet? รายการที่ส่งไปแล้วจะไม่ซ้ำ','ส่งเลย'))return;
  const el=()=>document.getElementById('shStatus');
  sheetBusy=true;
  try{
    for(let i=0;i<days.length;i+=8)await Promise.all(days.slice(i,i+8).map(fetchDay));
    let sent=0;
    for(const k of days){
      if(el())el().textContent='กำลังส่งวันที่ '+Number(k.slice(8))+'…';
      const d=sheetDiff(sheetRows(k,Object.keys(DAYS[k]||{})),k);
      if(d.n){await sheetPost(d.p);sent+=d.n;}
      sheetCommit(d.marks,k);
    }
    await sheetPost({stock:stockPayload()});sheetLastStock=Date.now();sheetStockDirty=false;
    sheetInfo='ส่งย้อนหลังเสร็จ '+sent+' รายการ ('+hhmm(Date.now())+')';toast('ส่งข้อมูลย้อนหลังเสร็จแล้ว');
  }catch(e){sheetInfo='ส่งย้อนหลังไม่สำเร็จ: '+e.message+' กดส่งอีกครั้งได้ ข้อมูลจะไม่ซ้ำ';toast('ส่งไม่สำเร็จ');}
  sheetBusy=false;if(el())el().textContent=sheetInfo;
}
async function sheetStockNow(){
  if(!sheetOn()){toast('เชื่อม Google Sheet ก่อน');return;}
  try{await sheetPost({stock:stockPayload()});sheetLastStock=Date.now();sheetStockDirty=false;sheetInfo='ส่งสต็อกแล้ว '+hhmm(Date.now());toast('ส่งสต็อกเข้า Sheet แล้ว');}

}

const sheetReports={};let sheetRepLoading=false,sheetRepErr='';
async function openSheetReport(ym,force){
  sumMode='sheet';viewMonth=ym;

  }catch(e){sheetRepErr=e.message==='Failed to fetch'?'เชื่อมต่อ Google Sheet ไม่ได้ ตรวจเน็ตหรือการ Deploy แบบ Anyone':e.message;}

}

/* shrink a photo to a small square JPEG so it syncs fast */
function shrinkImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const S=240,c=document.createElement('canvas');c.width=c.height=S;
      const s=Math.min(im.width,im.height);
      c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,S,S);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.72));
    };
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('อ่านรูปไม่ได้'));};
    im.src=url;
  });
}
async function addItem(){
  const name=document.getElementById('nName').value.trim();
  if(!name){toast('ใส่ชื่อสินค้า');return;}
  const f=document.getElementById('nImg').files[0];
  let img='';if(f){try{img=await shrinkImage(f);}catch(e){toast('อ่านรูปไม่ได้ ลองรูปอื่น');return;}}
  const id=uid(),maxOrder=Math.max(0,...Object.values(ITEMS).map(i=>i.order||0));
  itemWrite(id,{name,cat:document.getElementById('nCat').value,base:Math.round(+document.getElementById('nStock').value||0),net0:net(id),
    price:r2(+document.getElementById('nPrice').value||0),cost:r2(+document.getElementById('nCost').value||0),order:maxOrder+1,img},true);
  toast('เพิ่ม '+name+' แล้ว');render();
}

async function pushLocal(){
  if(!db||!LOCAL_ONLY)return;
  if(!await ask('อัปโหลดสินค้าและวัตถุดิบจากเครื่องนี้ขึ้นระบบ? ทุกเครื่องจะใช้รายการนี้','อัปโหลด'))return;
  const oldDev=DEV;
  for(const [id,it] of Object.entries(LOCAL_ONLY.items)){
    let st=Math.round((it.base||0)-(it.net0||0));for(const d of Object.values(oldDev))st+=((d.bought||{})[id]||0)-((d.sold||{})[id]||0);
    await itemWrite(id,Object.assign({},it,{base:st,net0:net(id)}),true);
  }
  for(const [id,r] of Object.entries(LOCAL_ONLY.raws||{}))await rawWrite(id,Object.assign({},r,{base:r.base||0,net0:rawNet(id)}),true);
  LOCAL_ONLY=null;toast('อัปโหลดแล้ว ทุกเครื่องจะเห็นรายการเดียวกัน');render();
}

function parseFb(txt){
  const o={};for(const k of FB_KEYS){const m=txt.match(new RegExp(k+'\\s*[:=]\\s*["\'`]([^"\'`]+)["\'`]'));if(m)o[k]=m[1].trim();}
  return o;
}
function saveFb(){
  const o=parseFb(document.getElementById('fbPaste').value||'');
  if(!o.apiKey||!o.projectId||!o.appId){toast('ไม่พบ apiKey / projectId / appId ในข้อความที่วาง ลองคัดลอกใหม่ทั้งก้อน');return;}
  try{localStorage.setItem('maidet-fb',JSON.stringify(o));}catch(e){}
  toast('บันทึกแล้ว กำลังเชื่อมต่อ…');setTimeout(()=>location.reload(),600);
}
function setupLink(){
  const fb={};FB_KEYS.forEach(k=>fb[k]=firebaseConfig[k]);
  return location.origin+location.pathname+'#setup='+encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify({firebase:fb})))));
}
async function copySetup(){
  const link=setupLink();
  try{await navigator.clipboard.writeText(link);toast('คัดลอกลิงก์แล้ว ส่งให้เครื่องอื่นเปิดครั้งเดียว');}
  catch(e){await ask('คัดลอกลิงก์นี้ไปเปิดในเครื่องอื่น: '+link,'ปิด');}
}
function dlConfig(){
  const fb=FB_KEYS.map(k=>'    '+k+': "'+(firebaseConfig[k]||'')+'"').join(',\n');
  const txt='// ไม้เด็ด: ไฟล์ตั้งค่า อัปโหลดไว้คู่กับ index.html ครั้งเดียว\nexport default {\n  firebase: {\n'+fb+'\n  },\n  sheetUrl: "'+SHEET_URL+'",\n  sheetToken: "'+SHEET_TOKEN+'"\n};\n';

}
async function syncTest(){

/* ---------- render & events ---------- */
function render(){
  renderPending=false;renderTill();
  const v=document.getElementById('view');
  const hadQ=document.activeElement&&document.activeElement.id==='q',pos=hadQ?document.activeElement.selectionStart:0;
  v.innerHTML=tab==='sell'?viewSell():tab==='buy'?viewBuy():tab==='sum'?viewSum():viewSet();
  if(tab==='buy')updateRawCalc();
  if(hadQ){const q=document.getElementById('q');if(q){q.focus();try{q.setSelectionRange(pos,pos);}catch(_){}}}
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
}
document.querySelector('nav.tabs').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;tab=b.dataset.tab;
  if(tab==='sum'){if(sumMode==='month')openMonth(viewMonth);else if(sumMode==='sheet')openSheetReport(viewMonth);else openDay(viewDay);}else render();
  window.scrollTo(0,0);
});

  const g=e.target.closest('[data-goday]');if(g){sumMode='day';openDay(g.dataset.goday);window.scrollTo(0,0);return;}
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.cat){catFilter=b.dataset.cat;render();return;}
  const a=b.dataset.act;
  if(b.dataset.mode){mode=b.dataset.mode;render();return;}
  if(b.dataset.step){step=+b.dataset.step;render();return;}
  if(a==='tap')tap(b.dataset.id,1);
  else if(a==='minus')tap(b.dataset.id,-1);
  else if(a==='rmImg'){ask('ลบรูปนี้?').then(ok=>{if(ok){itemWrite(b.dataset.id,{img:''});toast('ลบรูปแล้ว');render();}});}
  else if(b.dataset.rmode){RS.mode=b.dataset.rmode;render();}
  else if(a==='saveRawBuy')saveRawBuy();
  else if(a==='saveMake')saveMake();
  else if(a==='saveExp')saveExp();
  else if(a==='addLine'){RS.make.lines.push({raw:'',qty:''});RS.make.auto=false;render();}
  else if(a==='rmLine'){RS.make.lines.splice(+b.dataset.i,1);if(!RS.make.lines.length)RS.make.lines=[{raw:'',qty:''}];RS.make.auto=false;render();}
  else if(a==='goMake'){RS.mode='make';const r=b.dataset.raw;if(!RS.make.lines.some(l=>l.raw===r)){const empty=RS.make.lines.find(l=>!l.raw);if(empty)empty.raw=r;else RS.make.lines.push({raw:r,qty:''});}RS.make.auto=false;RS.lastBuy=null;render();window.scrollTo(0,0);}
  else if(a==='prefBuy'){RS.mode='buy';RS.buy.raw=b.dataset.raw;render();window.scrollTo(0,0);}
  else if(a==='delRaw'){const id=b.dataset.id,r=RAWS[id];if(r)ask('ลบวัตถุดิบ "'+r.name+'"?').then(ok=>{if(ok){rawDelete(id);toast('ลบ '+r.name+' แล้ว');render();}});}
  else if(a==='delBuy')delBuy(b.dataset.key);
  else if(a==='addItem')addItem();
  else if(a==='seed')seed();
  else if(a==='pushLocal')pushLocal();
  else if(a==='syncTest')syncTest();
  else if(a==='saveFb')saveFb();
  else if(a==='copySetup')copySetup();
  else if(a==='dlConfig')dlConfig();
  else if(a==='clearFb'){ask('ล้างค่า Firebase ที่เก็บในเครื่องนี้?','ล้างค่า').then(ok=>{if(ok){localStorage.removeItem('maidet-fb');location.reload();}});}
  else if(a==='sheetSave')sheetTest();
  else if(a==='sheetBackfill')sheetBackfill();
  else if(a==='sheetStock')sheetStockNow();
  else if(a==='delItem'){const id=b.dataset.id,it=ITEMS[id];if(it)ask('ลบ "'+it.name+'" ออกจากร้าน? ทุกเครื่องจะไม่เห็นสินค้านี้อีก').then(ok=>{if(ok){itemDelete(id);toast('ลบ '+it.name+' แล้ว');render();}});}
  else if(b.dataset.smode){const m=b.dataset.smode;if(m==='month')openMonth(viewMonth);else if(m==='sheet')openSheetReport(viewMonth);else{sumMode='day';openDay(viewDay);}}
  else if(a==='sheetReload')openSheetReport(viewMonth,true);
  else if(a==='monthPrev'||a==='monthNext'){const [y,m]=viewMonth.split('-').map(Number),d=new Date(y,m-1+(a==='monthPrev'?-1:1),1);const nm=dkey(d).slice(0,7);if(sumMode==='sheet')openSheetReport(nm);else openMonth(nm);}
  else if(a==='dayPrev'||a==='dayNext'){const d=new Date(viewDay+'T12:00:00');d.setDate(d.getDate()+(a==='dayPrev'?-1:1));openDay(dkey(d));}
});
view.addEventListener('input',e=>{
  if(e.target.id==='q'){query=e.target.value;render();}
  else if(tab==='buy')onRawInput(e.target,false);
});
view.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='dayPick'&&t.value){openDay(t.value);return;}
  if(tab==='buy'){onRawInput(t,true);return;}
  if(t.dataset.rf&&t.dataset.rid){
    const id=t.dataset.rid,r=RAWS[id];if(!r)return;const f=t.dataset.rf;
    if(f==='name'||f==='unit'){const v=t.value.trim();if(v)rawWrite(id,{[f]:v});else t.value=r[f];}
    else if(f==='stock')rawWrite(id,{base:R3(+t.value||0),net0:rawNet(id)});
    else rawWrite(id,{cost:r2(+t.value||0)});
    toast('บันทึกแล้ว');return;
  }
  if(t.dataset.img&&t.files&&t.files[0]){
    const id=t.dataset.img;
    shrinkImage(t.files[0]).then(img=>{itemWrite(id,{img});toast('เปลี่ยนรูปแล้ว');render();}).catch(()=>toast('อ่านรูปไม่ได้ ลองรูปอื่น'));
    return;
  }
  if(t.dataset.f&&t.dataset.id){
    const id=t.dataset.id,it=ITEMS[id];if(!it)return;const f=t.dataset.f;
    if(f==='name'){const v=t.value.trim();if(v)itemWrite(id,{name:v});else t.value=it.name;}
    else if(f==='stock')itemWrite(id,{base:Math.round(+t.value||0),net0:net(id)});
    else itemWrite(id,{[f]:r2(+t.value||0)});
    renderTill();toast('บันทึกแล้ว');
  }
});

const FB_FROM=(CFG.firebase&&CFG.firebase.projectId)?'config.js':(LOCAL_FB&&LOCAL_FB.projectId)?'เครื่องนี้':'';
const firebaseConfig = Object.assign({apiKey:"",authDomain:"",projectId:"",storageBucket:"",messagingSenderId:"",appId:""}, FB_FROM==='config.js'?CFG.firebase:(LOCAL_FB||{}));

async function connectFirebase(){
  const V='10.12.2', base='https://www.gstatic.com/firebasejs/'+V+'/';
  const {initializeApp}=await import(base+'firebase-app.js');
  const F=await import(base+'firebase-firestore.js');
  const A=await import(base+'firebase-auth.js');
  FB.step='auth';
  const app=initializeApp(firebaseConfig);
  await A.signInAnonymously(A.getAuth(app));
  FB.step='db';
  let fdb;
  try{fdb=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})});}
  catch(e){fdb=F.getFirestore(app);}
  const wrapDoc=d=>({id:d.id,exists:true,data:()=>d.data()});
  const wrapQ=s=>({docs:s.docs.map(wrapDoc),size:s.size,empty:s.empty,metadata:s.metadata,docChanges:()=>s.docChanges().map(c=>({type:c.type,doc:wrapDoc(c.doc)}))});
  return {
    doc:p=>({
      get:async()=>{const s=await F.getDoc(F.doc(fdb,p));return {id:s.id,exists:s.exists(),data:()=>s.data()};},
      set:d=>F.setDoc(F.doc(fdb,p),d),
      update:d=>F.updateDoc(F.doc(fdb,p),d),
      delete:()=>F.deleteDoc(F.doc(fdb,p))
    }),
    collection:p=>({
      get:async()=>wrapQ(await F.getDocs(F.collection(fdb,p))),
      onSnapshot:(next,err)=>F.onSnapshot(F.collection(fdb,p),s=>next(wrapQ(s)),err)
    })
  };
}
